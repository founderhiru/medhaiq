<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Founder Dashboard — MedhaIQ</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          // Warm-light executive palette — typography/color polish pass.
          // Same structure as before (ivory page, warm-white cards, warm-
          // neutral borders); values refined for stronger text contrast.
          // Semantic accents keep their MEANING (positive/warning/negative/
          // accent) — only the exact hex values were tuned, restrained on
          // purpose: only used where a metric genuinely IS positive,
          // costly, or negative — never applied to ordinary numbers.
          page: '#F7F3EC',
          card: '#FFFCF8',
          cardAlt: '#F3ECDF',
          hairline: '#E6DED2',
          ink: '#29251F',
          inkSoft: '#756D62',
          inkFaint: '#958B7D',
          label: '#817767',
          accent: '#6750C8',
          gold: '#B08D57',
          good: '#16845A',
          warn: '#B97800',
          bad: '#C84A3F',
        },
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>
<style>
  body { background: #F7F3EC; }
  .card {
    background: #FFFCF8;
    border: 1px solid #E6DED2;
    box-shadow: 0 1px 2px rgba(41,37,31,0.05), 0 1px 0 rgba(41,37,31,0.02);
  }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .skeleton { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.75; } }
  .hairline-gold { background: linear-gradient(90deg, #B08D57 0%, rgba(176,141,87,0) 100%); height: 2px; }
</style>
</head>
<body class="min-h-screen font-sans text-ink antialiased">

  <div class="max-w-5xl mx-auto px-6 py-10">

    <!-- Header -->
    <div class="flex items-start justify-between mb-6">
      <div>
        <h1 class="text-xl font-semibold tracking-tight text-ink">Founder Dashboard</h1>
        <p class="text-xs text-inkFaint mt-1">Revenue, AI cost, and true profit — from your live cost ledger</p>
      </div>
      <div class="flex items-center gap-2">
        <span id="asOfLabel" class="text-xs text-inkFaint"></span>
        <button id="refreshBtn" class="text-xs px-3 py-1.5 rounded-md border border-hairline bg-card hover:bg-cardAlt transition text-inkSoft">
          Refresh
        </button>
      </div>
    </div>

    <!-- Error banner -->
    <div id="errorBanner" class="hidden mb-5 rounded-lg border border-bad/30 bg-bad/5 text-bad text-sm px-4 py-3"></div>

    <!-- Secret prompt -->
    <div id="authPrompt" class="hidden mb-5 rounded-lg border border-hairline bg-card px-4 py-4">
      <label class="block text-sm text-inkSoft mb-2">Admin secret required</label>
      <div class="flex gap-2">
        <input id="secretInput" type="password" placeholder="x-admin-secret"
               class="flex-1 bg-page border border-hairline rounded-md px-3 py-2 text-sm text-ink focus:outline-none focus:ring-1 focus:ring-accent">
        <button id="secretSubmit" class="px-4 py-2 rounded-md bg-accent text-white text-sm font-medium hover:opacity-90 transition">
          Unlock
        </button>
      </div>
    </div>

    <!-- Month selector strip -->
    <div class="flex items-center justify-between mb-2">
      <div class="flex items-center gap-2">
        <select id="monthSelect" class="text-sm font-medium text-ink bg-transparent border-none focus:outline-none focus:ring-1 focus:ring-accent rounded cursor-pointer"></select>
      </div>
    </div>
    <div class="hairline-gold rounded-full mb-6"></div>

    <!-- Revenue note (INR / unresolved purchases) -->
    <div id="revenueNote" class="hidden mb-6 rounded-lg border border-gold/30 bg-gold/5 text-inkSoft text-xs px-4 py-2.5"></div>

    <!-- 1a. Revenue — This Month / YTD / All Time -->
    <section class="mb-4">
      <div id="revenueGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
    </section>

    <!-- 1b. Founder Financial Overview (cost/profit) -->
    <section class="mb-8">
      <div id="financialGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
    </section>

    <!-- 2. Business & Unit Economics -->
    <section class="mb-8">
      <h2 class="text-xs font-semibold uppercase tracking-[0.04em] text-label mb-3">Business &amp; unit economics</h2>
      <div id="unitGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-4"></div>
      <p id="maxCostNote" class="hidden text-xs text-inkFaint mt-2"></p>
    </section>

    <!-- 3. Provider Spend + 4. Fixed Infrastructure, side by side -->
    <section class="mb-8 grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="card rounded-xl px-5 py-4">
        <h2 class="text-xs font-semibold uppercase tracking-[0.04em] text-label mb-3">Provider spend — <span id="providerMonthLabel"></span></h2>
        <div id="providerTable"></div>
      </div>
      <div class="card rounded-xl px-5 py-4">
        <h2 class="text-xs font-semibold uppercase tracking-[0.04em] text-label mb-3">Fixed infrastructure — <span id="fixedMonthLabel"></span></h2>
        <div id="fixedTable"></div>
      </div>
    </section>

    <!-- 5. Monthly Trend -->
    <section class="mb-8">
      <h2 class="text-xs font-semibold uppercase tracking-[0.04em] text-label mb-3">Monthly trend</h2>
      <div class="card rounded-xl px-5 py-4">
        <div id="trendTable"></div>
        <p class="text-xs text-inkFaint mt-3">Trend history builds up month over month — only months with real data will ever appear here.</p>
      </div>
    </section>

    <!-- 6. Today strip (secondary, de-emphasized) -->
    <section class="mb-8">
      <h2 class="text-xs font-semibold uppercase tracking-[0.04em] text-label mb-3">Today</h2>
      <div id="todayStrip" class="flex flex-wrap gap-x-6 gap-y-2 text-sm text-inkSoft"></div>
    </section>

    <!-- 7. AI Provider Status — compact, visually subordinate to Financial Overview -->
    <section>
      <h2 class="text-xs font-semibold uppercase tracking-[0.04em] text-label mb-3">AI provider status</h2>
      <div class="card rounded-xl px-5 py-4">
        <div id="providerStatusTable"></div>
      </div>
    </section>

  </div>

<script>
(function () {
  const ENDPOINT = '/api/admin/founder-dashboard';
  const PROVIDER_STATUS_ENDPOINT = '/api/admin/provider-status';
  const SECRET_KEY = 'medhaiq_admin_secret';

  const revenueGrid = document.getElementById('revenueGrid');
  const financialGrid = document.getElementById('financialGrid');
  const unitGrid = document.getElementById('unitGrid');
  const maxCostNote = document.getElementById('maxCostNote');
  const providerTable = document.getElementById('providerTable');
  const fixedTable = document.getElementById('fixedTable');
  const trendTable = document.getElementById('trendTable');
  const todayStrip = document.getElementById('todayStrip');
  const providerStatusTable = document.getElementById('providerStatusTable');
  const monthSelect = document.getElementById('monthSelect');
  const providerMonthLabel = document.getElementById('providerMonthLabel');
  const fixedMonthLabel = document.getElementById('fixedMonthLabel');
  const revenueNote = document.getElementById('revenueNote');
  const errorBanner = document.getElementById('errorBanner');
  const authPrompt = document.getElementById('authPrompt');
  const asOfLabel = document.getElementById('asOfLabel');
  const refreshBtn = document.getElementById('refreshBtn');
  const secretInput = document.getElementById('secretInput');
  const secretSubmit = document.getElementById('secretSubmit');

  const money = (v) => `$${(Number(v) || 0).toFixed(2)}`;
  const num = (v, d = 0) => (Number(v) || 0).toFixed(d);
  const hasData = (v) => v !== null && v !== undefined && !Number.isNaN(Number(v));

  function statCard({ label, value, sub, accentClass }) {
    return `
      <div class="card rounded-xl px-4 py-4">
        <p class="text-[11px] uppercase tracking-wide text-inkFaint mb-1.5">${label}</p>
        <p class="text-2xl font-semibold num ${accentClass || 'text-ink'}">${value}</p>
        ${sub ? `<p class="text-[11px] text-inkFaint mt-1.5 leading-snug">${sub}</p>` : ''}
      </div>
    `;
  }

  function skeletonCards(n) {
    return Array.from({ length: n }).map(() => `
      <div class="card rounded-xl px-4 py-4">
        <div class="skeleton h-2.5 w-16 bg-hairline rounded mb-3"></div>
        <div class="skeleton h-6 w-24 bg-hairline rounded"></div>
      </div>
    `).join('');
  }

  function skeletonAll() {
    revenueGrid.innerHTML = skeletonCards(3);
    financialGrid.innerHTML = skeletonCards(3);
    unitGrid.innerHTML = skeletonCards(4);
    providerTable.innerHTML = '<div class="skeleton h-20 bg-hairline rounded"></div>';
    fixedTable.innerHTML = '<div class="skeleton h-20 bg-hairline rounded"></div>';
    trendTable.innerHTML = '<div class="skeleton h-10 bg-hairline rounded"></div>';
    todayStrip.innerHTML = '';
  }

  function renderStats(d) {
    const months = d.available_months || [];
    const selected = d.selected_month || { value: '', label: '\u2014' };

    // Populate the selector fresh each load — only ever real months with
    // activity (months[]), never a fabricated range. Re-populating on
    // every render keeps it in sync if new months appear over time.
    monthSelect.innerHTML = months.length
      ? months.map((m) => `<option value="${m.value}" ${m.value === selected.value ? 'selected' : ''}>${m.label}</option>`).join('')
      : `<option value="${selected.value}">${selected.label}</option>`;

    // ── Revenue note (INR tracked separately / unresolved purchases) ─────
    if (d.revenue_note) {
      revenueNote.textContent = d.revenue_note;
      revenueNote.classList.remove('hidden');
    } else {
      revenueNote.classList.add('hidden');
    }

    // ── 1a. Revenue — This Month / YTD / All Time. Same underlying source
    // (package_acquisitions, source='purchase') for all three — only the
    // date range differs, so YTD is never less than This Month, and All
    // Time is never less than YTD, by construction, not enforcement. These
    // are ALWAYS the current calendar month/year/lifetime — independent of
    // the month selector above, per instruction.
    revenueGrid.innerHTML = [
      statCard({
        label: 'Revenue · this month',
        value: money(d.monthly_revenue),
        sub: d.monthly_revenue_inr > 0 ? `+ ₹${num(d.monthly_revenue_inr, 2)} (kept separate)` : 'Real purchases, month to date',
      }),
      statCard({
        label: 'Revenue · YTD',
        value: money(d.revenue_ytd_usd),
        sub: d.revenue_ytd_inr > 0 ? `Jan 1 \u2192 today · + ₹${num(d.revenue_ytd_inr, 2)} (kept separate)` : 'Jan 1 \u2192 today',
      }),
      statCard({
        label: 'Revenue · all time',
        value: money(d.total_revenue_usd),
        sub: d.total_revenue_inr > 0 ? `+ ₹${num(d.total_revenue_inr, 2)} (kept separate)` : 'Since first purchase',
      }),
    ].join('');

    // ── 1b. Founder Financial Overview — genuinely scoped to the SELECTED
    // month (may differ from the current calendar month above). AI cost,
    // fixed cost, and true profit/margin are all computed from real
    // cost_analytics/fixed_costs rows filtered to that month's date range —
    // no more "today" vs "all-time" mismatch against the provider table.
    const trueMarginClass = d.month_true_margin_pct >= 0 ? 'text-good' : 'text-bad';
    financialGrid.innerHTML = [
      statCard({
        label: `Revenue · ${selected.label}`,
        value: money(d.month_revenue_usd),
        sub: d.month_revenue_inr > 0 ? `+ ₹${num(d.month_revenue_inr, 2)} (kept separate)` : 'Real purchases this month',
      }),
      statCard({
        label: `AI cost · ${selected.label}`,
        value: money(d.month_ai_cost),
        sub: 'Vapi + Claude + ElevenLabs (if captured)',
        accentClass: 'text-warn',
      }),
      statCard({
        label: `Fixed cost · ${selected.label}`,
        value: money(d.month_fixed_cost),
        sub: 'Configured monthly rate, that month',
      }),
      statCard({
        label: `True profit · ${selected.label}`,
        value: money(d.month_true_profit),
        sub: `${num(d.month_true_margin_pct, 1)}% true margin`,
        accentClass: trueMarginClass,
      }),
    ].join('');

    // ── 2. Business & unit economics — also selected-month scoped, except
    // Paid Users, which has no historical monthly snapshot (only "who
    // currently holds a paid package" exists) — documented limitation.
    const noInterviews = !d.month_interviews_count || d.month_interviews_count === 0;
    const noPaidUsers = !d.paying_users_count || d.paying_users_count === 0;
    unitGrid.innerHTML = [
      statCard({
        label: 'Interviews',
        value: d.month_interviews_count ?? 0,
        sub: selected.label,
      }),
      statCard({
        label: 'Paid users',
        value: d.paying_users_count ?? 0,
        sub: `${d.trial_users_count ?? 0} on trial \u00b7 current, not month-specific`,
      }),
      statCard({
        label: 'Cost / interview',
        value: noInterviews ? '\u2014' : money(d.month_cost_per_interview),
        sub: noInterviews ? 'No interviews yet' : 'AI cost \u00f7 interviews',
      }),
      statCard({
        label: 'Cost / paid user',
        value: noPaidUsers ? '\u2014' : money(d.cost_per_paid_user),
        sub: noPaidUsers ? 'No paid users yet' : 'AI cost \u00f7 paid users',
      }),
    ].join('');

    // Max Cost Session isn't tracked at month-scope yet (only "today" and
    // "all-time" query it) — hidden rather than shown against the wrong
    // period. See limitations.
    maxCostNote.classList.add('hidden');

    // ── 3. Provider spend — month-scoped, from month_provider_breakdown[].
    // Claude + Vapi + ElevenLabs (if captured) reconciles exactly with
    // month_ai_cost above by construction (both come from the same
    // computeMonthFinancials() call server-side).
    providerMonthLabel.textContent = selected.label;
    const payg = (d.month_provider_breakdown || []).filter((r) => r.type === 'PAYG');
    providerTable.innerHTML = payg.length ? `
      <table class="w-full text-sm">
        <thead>
          <tr class="text-inkFaint text-[11px] uppercase tracking-wide">
            <th class="text-left font-medium pb-2">Provider</th>
            <th class="text-right font-medium pb-2">Cost</th>
            <th class="text-right font-medium pb-2">Status</th>
          </tr>
        </thead>
        <tbody>
          ${payg.map((r) => `
            <tr class="border-t border-hairline">
              <td class="py-2 text-ink">${r.provider}</td>
              <td class="py-2 text-right num ${r.cost_usd === null ? 'text-inkFaint' : 'text-ink'}">${r.cost_usd === null ? '\u2014' : money(r.cost_usd)}</td>
              <td class="py-2 text-right text-[11px] ${r.cost_usd === null ? 'text-inkFaint' : 'text-good'}">${r.cost_usd === null ? 'Not captured' : 'Captured'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    ` : '<p class="text-sm text-inkFaint">No provider data for this month.</p>';

    // ── 4. Fixed infrastructure — month-scoped, from month_fixed_cost_rows[],
    // never hardcoded. A fixed cost added after this month's end is
    // excluded server-side (effective_date filter), not here.
    fixedMonthLabel.textContent = selected.label;
    const fixedRows = d.month_fixed_cost_rows || [];
    fixedTable.innerHTML = fixedRows.length ? `
      <table class="w-full text-sm">
        <thead>
          <tr class="text-inkFaint text-[11px] uppercase tracking-wide">
            <th class="text-left font-medium pb-2">Provider</th>
            <th class="text-right font-medium pb-2">This month</th>
            <th class="text-right font-medium pb-2">Period</th>
          </tr>
        </thead>
        <tbody>
          ${fixedRows.map((r) => `
            <tr class="border-t border-hairline">
              <td class="py-2 text-ink">${r.provider.charAt(0).toUpperCase() + r.provider.slice(1)}</td>
              <td class="py-2 text-right num text-ink">${r.currency === 'USD' ? money(r.monthly_allocation_usd) : `${r.currency} ${num(r.amount, 2)}`}</td>
              <td class="py-2 text-right text-[11px] text-inkFaint">${r.billing_period}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    ` : '<p class="text-sm text-inkFaint">No fixed costs configured.</p>';

    // ── 5. Monthly trend — real months only, from monthly_trend[], never
    // fabricated. Grows automatically as more months accumulate real data.
    const trend = d.monthly_trend || [];
    trendTable.innerHTML = trend.length ? `
      <table class="w-full text-sm">
        <thead>
          <tr class="text-inkFaint text-[11px] uppercase tracking-wide">
            <th class="text-left font-medium pb-2">Month</th>
            <th class="text-right font-medium pb-2">Revenue</th>
            <th class="text-right font-medium pb-2">AI cost</th>
            <th class="text-right font-medium pb-2">Fixed cost</th>
            <th class="text-right font-medium pb-2">True profit</th>
          </tr>
        </thead>
        <tbody>
          ${trend.map((m) => `
            <tr class="border-t border-hairline">
              <td class="py-2 text-ink">${m.label}</td>
              <td class="py-2 text-right num text-ink">${money(m.revenue_usd)}</td>
              <td class="py-2 text-right num text-ink">${money(m.ai_cost)}</td>
              <td class="py-2 text-right num text-ink">${money(m.fixed_cost)}</td>
              <td class="py-2 text-right num ${m.true_profit >= 0 ? 'text-good' : 'text-bad'}">${money(m.true_profit)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    ` : '<p class="text-sm text-inkFaint">No months with data yet.</p>';

    // ── 6. Today strip ─────────────────────────────────────────────────────
    todayStrip.innerHTML = `
      <span><span class="text-inkFaint">Revenue</span> <span class="num font-medium text-ink">${money(d.revenue_today)}</span></span>
      <span><span class="text-inkFaint">AI cost</span> <span class="num font-medium text-ink">${money(d.todays_total_ai_cost)}</span></span>
      <span><span class="text-inkFaint">Interviews</span> <span class="num font-medium text-ink">${d.interviews_today_count ?? 0}</span></span>
      <span><span class="text-inkFaint">New users</span> <span class="num font-medium text-ink">${d.new_users_today ?? 0}</span></span>
    `;

    asOfLabel.textContent = `As of ${new Date().toLocaleTimeString()}`;
  }

  // ── AI Provider Status — deliberately independent of renderStats/load()
  // above. A failure here (provider API down, network error) must never
  // clear or block the main financial dashboard — it only ever touches
  // providerStatusTable's own content.
  const PROVIDER_LABELS = { claude: 'Claude', vapi: 'Vapi', elevenlabs: 'ElevenLabs' };
  const STATUS_DOT_CLASS = {
    active: 'bg-good',
    'no usage this month': 'bg-inkFaint',
    'balance check failed': 'bg-bad',
    unavailable: 'bg-inkFaint',
  };

  function formatBalance(p) {
    if (!p.balanceAvailable) return { text: 'Balance unavailable via API', cls: 'text-inkFaint' };
    const unit = p.balanceUnit === 'credits' ? 'credits' : (p.balanceUnit || '');
    const text = `${Number(p.balance).toLocaleString()} ${unit}`.trim();
    return { text, cls: p.lowBalance ? 'text-warn' : 'text-ink' };
  }

  function formatUsage(p) {
    if (p.usageThisMonth === null || p.usageThisMonth === undefined) return '\u2014';
    return money(p.usageThisMonth);
  }

  function renderProviderStatus(status) {
    if (!status) {
      providerStatusTable.innerHTML = '<p class="text-sm text-inkFaint">Provider status unavailable right now.</p>';
      return;
    }
    const rows = ['claude', 'vapi', 'elevenlabs'].filter((k) => status[k]);
    providerStatusTable.innerHTML = `
      <table class="w-full text-sm">
        <thead>
          <tr class="text-inkFaint text-[11px] uppercase tracking-wide">
            <th class="text-left font-medium pb-2">Provider</th>
            <th class="text-right font-medium pb-2">Balance / credits</th>
            <th class="text-right font-medium pb-2">Used this month</th>
            <th class="text-right font-medium pb-2">Status</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((key) => {
            const p = status[key];
            const balance = formatBalance(p);
            const dotClass = STATUS_DOT_CLASS[p.status] || 'bg-inkFaint';
            const lowBalanceNote = p.lowBalance ? '<div class="text-[11px] text-warn mt-0.5">\u26a0 Low balance</div>' : '';
            return `
              <tr class="border-t border-hairline align-top">
                <td class="py-2 text-ink">${PROVIDER_LABELS[key]}</td>
                <td class="py-2 text-right num ${balance.cls}">${balance.text}${lowBalanceNote}</td>
                <td class="py-2 text-right num text-ink">${formatUsage(p)}</td>
                <td class="py-2 text-right text-[11px] text-inkSoft">
                  <span class="inline-block w-1.5 h-1.5 rounded-full ${dotClass} mr-1.5 align-middle"></span>${p.status}
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    `;
  }

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.classList.remove('hidden');
  }
  function hideError() {
    errorBanner.classList.add('hidden');
  }
  function clearAll() {
    revenueGrid.innerHTML = '';
    financialGrid.innerHTML = '';
    unitGrid.innerHTML = '';
    providerTable.innerHTML = '';
    fixedTable.innerHTML = '';
    trendTable.innerHTML = '';
    todayStrip.innerHTML = '';
    maxCostNote.classList.add('hidden');
    revenueNote.classList.add('hidden');
  }

  async function load(monthValue) {
    hideError();
    skeletonAll();
    const secret = sessionStorage.getItem(SECRET_KEY) || '';
    const url = monthValue ? `${ENDPOINT}?month=${encodeURIComponent(monthValue)}` : ENDPOINT;

    try {
      const res = await fetch(url, {
        headers: secret ? { 'x-admin-secret': secret } : {},
      });

      if (res.status === 403) {
        authPrompt.classList.remove('hidden');
        showError('Admin secret required or incorrect.');
        clearAll();
        return;
      }
      authPrompt.classList.add('hidden');

      if (!res.ok) {
        showError(`Failed to load dashboard (HTTP ${res.status}).`);
        clearAll();
        return;
      }

      const data = await res.json();
      renderStats(data || {});
    } catch (err) {
      showError('Network error loading dashboard. Check your connection and try again.');
      clearAll();
    }
  }

  // Independent fetch — a failure here never shows the main error banner
  // and never clears the financial dashboard above it. One provider (or
  // all three) being unavailable just shows as such in this one panel.
  async function loadProviderStatus() {
    const secret = sessionStorage.getItem(SECRET_KEY) || '';
    try {
      const res = await fetch(PROVIDER_STATUS_ENDPOINT, {
        headers: secret ? { 'x-admin-secret': secret } : {},
      });
      if (!res.ok) {
        renderProviderStatus(null);
        return;
      }
      const status = await res.json();
      renderProviderStatus(status);
    } catch (err) {
      renderProviderStatus(null);
    }
  }

  refreshBtn.addEventListener('click', () => { load(monthSelect.value || undefined); loadProviderStatus(); });
  monthSelect.addEventListener('change', () => load(monthSelect.value));
  secretSubmit.addEventListener('click', () => {
    sessionStorage.setItem(SECRET_KEY, secretInput.value.trim());
    load(monthSelect.value || undefined);
    loadProviderStatus();
  });
  secretInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') secretSubmit.click();
  });

  load();
  loadProviderStatus();
})();
</script>
</body>
</html>
