<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Founder Dashboard — MedhaIQ</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0a0a0f',
          panel: '#13131a',
          border: '#22222c',
          accent: '#7c5cff',
          good: '#22c55e',
          warn: '#f59e0b',
          bad: '#ef4444',
        },
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>
<style>
  body { background: radial-gradient(1200px 600px at 20% -10%, #1a1230 0%, #0a0a0f 55%); }
  .card { background: linear-gradient(180deg, #14141c 0%, #101017 100%); }
  .skeleton { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }
</style>
</head>
<body class="min-h-screen font-sans text-gray-100 antialiased">

  <div class="max-w-6xl mx-auto px-6 py-10">

    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight text-white">Founder Dashboard</h1>
        <p class="text-sm text-gray-500 mt-1">Today's revenue, AI cost, and margin — live from <span class="font-mono text-gray-400">cost_analytics</span></p>
      </div>
      <div class="flex items-center gap-3">
        <span id="asOfLabel" class="text-xs text-gray-500"></span>
        <button id="refreshBtn" class="text-xs px-3 py-1.5 rounded-md border border-border bg-panel hover:bg-white/5 transition text-gray-300">
          Refresh
        </button>
      </div>
    </div>

    <!-- Error banner -->
    <div id="errorBanner" class="hidden mb-6 rounded-lg border border-bad/30 bg-bad/10 text-bad text-sm px-4 py-3"></div>

    <!-- Secret prompt (shown only if a request comes back 403) -->
    <div id="authPrompt" class="hidden mb-6 rounded-lg border border-border bg-panel px-4 py-4">
      <label class="block text-sm text-gray-300 mb-2">Admin secret required</label>
      <div class="flex gap-2">
        <input id="secretInput" type="password" placeholder="x-admin-secret"
               class="flex-1 bg-bg border border-border rounded-md px-3 py-2 text-sm text-gray-100 focus:outline-none focus:ring-1 focus:ring-accent">
        <button id="secretSubmit" class="px-4 py-2 rounded-md bg-accent text-white text-sm font-medium hover:opacity-90 transition">
          Unlock
        </button>
      </div>
    </div>

    <!-- 1. The Financial Core -->
    <section class="mb-10">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-500 mb-4">1. The Financial Core</h2>
      <div id="financialGrid" class="grid grid-cols-1 sm:grid-cols-3 gap-5"></div>
    </section>

    <!-- 2. Volumetric Health -->
    <section class="mb-10">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-500 mb-4">2. Volumetric Health</h2>
      <div id="volumeGrid" class="grid grid-cols-1 sm:grid-cols-3 gap-5"></div>
    </section>

    <!-- 3. Granular Spends & Flags -->
    <section>
      <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-500 mb-4">3. Granular Spends & Flags</h2>
      <div id="spendGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-5"></div>
    </section>

  </div>

<script>
(function () {
  const ENDPOINT = '/api/admin/founder-dashboard';
  const SECRET_KEY = 'medhaiq_admin_secret';

  const financialGrid = document.getElementById('financialGrid');
  const volumeGrid = document.getElementById('volumeGrid');
  const spendGrid = document.getElementById('spendGrid');
  const errorBanner = document.getElementById('errorBanner');
  const authPrompt = document.getElementById('authPrompt');
  const asOfLabel = document.getElementById('asOfLabel');
  const refreshBtn = document.getElementById('refreshBtn');
  const secretInput = document.getElementById('secretInput');
  const secretSubmit = document.getElementById('secretSubmit');

  const money = (v) => `$${(Number(v) || 0).toFixed(2)}`;
  const num = (v, d = 0) => (Number(v) || 0).toFixed(d);

  function cardTemplate({ label, value, sub, accentClass }) {
    return `
      <div class="rounded-xl border border-border card px-6 py-5 hover:border-accent/40 transition">
        <p class="text-xs uppercase tracking-wide text-gray-500 mb-2">${label}</p>
        <p class="text-3xl font-semibold ${accentClass || 'text-white'}">${value}</p>
        ${sub ? `<p class="text-xs text-gray-500 mt-2">${sub}</p>` : ''}
      </div>
    `;
  }

  function skeletonCards(n) {
    return Array.from({ length: n }).map(() => `
      <div class="rounded-xl border border-border card px-6 py-5">
        <div class="skeleton h-3 w-24 bg-white/10 rounded mb-3"></div>
        <div class="skeleton h-8 w-32 bg-white/10 rounded"></div>
      </div>
    `).join('');
  }

  function skeletonAll() {
    financialGrid.innerHTML = skeletonCards(3);
    volumeGrid.innerHTML = skeletonCards(3);
    spendGrid.innerHTML = skeletonCards(2);
  }

  function renderStats(d) {
    const marginClass = d.today_profit_margin_pct >= 0 ? 'text-good' : 'text-bad';

    // 1. The Financial Core
    financialGrid.innerHTML = [
      cardTemplate({
        label: "Today's revenue",
        value: money(d.revenue_today),
        sub: `${money(d.monthly_revenue)} MRR ÷ 30`,
      }),
      cardTemplate({
        label: "Today's cost",
        value: money(d.todays_total_ai_cost),
        sub: 'Sum of direct API usage today',
        accentClass: 'text-warn',
      }),
      cardTemplate({
        label: 'Gross margin',
        value: `${num(d.today_profit_margin_pct, 1)}%`,
        sub: `${money(d.gross_profit)} gross profit`,
        accentClass: marginClass,
      }),
    ].join('');

    // 2. Volumetric Health
    volumeGrid.innerHTML = [
      cardTemplate({
        label: "Today's interviews",
        value: d.interviews_today_count ?? 0,
      }),
      cardTemplate({
        label: 'New & paying users',
        value: `${d.new_users_today ?? 0} / ${d.paying_users_count ?? 0}`,
        sub: `${d.new_users_today ?? 0} new today (${d.new_trial_users_today ?? 0} trial) · ${d.paying_users_count ?? 0} paying total`,
        accentClass: 'text-accent',
      }),
      cardTemplate({
        label: 'MRR',
        value: money(d.monthly_revenue),
        sub: 'Recurring software baseline',
      }),
    ].join('');

    // 3. Granular Spends & Flags
    const vapiCost = Number(d.todays_vapi_cost) || 0;
    const claudeCost = Number(d.todays_claude_cost) || 0;
    const totalCost = vapiCost + claudeCost;
    const vapiPct = totalCost > 0 ? (vapiCost / totalCost) * 100 : 0;
    const claudePct = totalCost > 0 ? (claudeCost / totalCost) * 100 : 0;

    spendGrid.innerHTML = `
      <div class="rounded-xl border border-border card px-6 py-5">
        <p class="text-xs uppercase tracking-wide text-gray-500 mb-3">AI spend breakdown</p>
        <div class="flex justify-between text-sm mb-1">
          <span class="text-gray-300">Vapi (voice)</span>
          <span class="font-medium text-white">${money(vapiCost)}</span>
        </div>
        <div class="w-full h-1.5 rounded-full bg-white/5 mb-3">
          <div class="h-1.5 rounded-full bg-accent" style="width:${num(vapiPct, 0)}%"></div>
        </div>
        <div class="flex justify-between text-sm mb-1">
          <span class="text-gray-300">Claude (context/tokens)</span>
          <span class="font-medium text-white">${money(claudeCost)}</span>
        </div>
        <div class="w-full h-1.5 rounded-full bg-white/5">
          <div class="h-1.5 rounded-full bg-warn" style="width:${num(claudePct, 0)}%"></div>
        </div>
      </div>
      ${cardTemplate({
        label: 'Max cost session',
        value: money(d.most_expensive_interview_cost),
        sub: 'Surfaces anomalous runs — runaway streams or boundary-testing sessions',
        accentClass: 'text-bad',
      })}
    `;

    asOfLabel.textContent = `As of ${new Date().toLocaleTimeString()}`;
  }

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.classList.remove('hidden');
  }

  function hideError() {
    errorBanner.classList.add('hidden');
  }

  async function load() {
    hideError();
    skeletonAll();
    const secret = sessionStorage.getItem(SECRET_KEY) || '';

    try {
      const res = await fetch(ENDPOINT, {
        headers: secret ? { 'x-admin-secret': secret } : {},
      });

      if (res.status === 403) {
        authPrompt.classList.remove('hidden');
        showError('Admin secret required or incorrect.');
        financialGrid.innerHTML = '';
        volumeGrid.innerHTML = '';
        spendGrid.innerHTML = '';
        return;
      }

      authPrompt.classList.add('hidden');

      if (!res.ok) {
        showError(`Failed to load dashboard (HTTP ${res.status}).`);
        financialGrid.innerHTML = '';
        volumeGrid.innerHTML = '';
        spendGrid.innerHTML = '';
        return;
      }

      const data = await res.json();
      renderStats(data || {});
    } catch (err) {
      showError('Network error loading dashboard. Check your connection and try again.');
      financialGrid.innerHTML = '';
      volumeGrid.innerHTML = '';
      spendGrid.innerHTML = '';
    }
  }

  refreshBtn.addEventListener('click', load);
  secretSubmit.addEventListener('click', () => {
    sessionStorage.setItem(SECRET_KEY, secretInput.value.trim());
    load();
  });
  secretInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') secretSubmit.click();
  });

  load();
})();
</script>
</body>
</html>
