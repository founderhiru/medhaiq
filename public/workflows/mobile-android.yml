name: MedhaIQ Mobile - Android build

# Builds the Android app in GitHub's cloud. Nothing to install on your computer.
# Run it from the repo's Actions tab -> "MedhaIQ Mobile - Android build" -> Run workflow.
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run add:android
      - run: npm run assets -- --android
      - run: npx cap sync android
      - name: Build debug APK (installable on any Android phone/tablet)
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MedhaIQ-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
